<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Harbor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #16171a;
        color: #6e737c;
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #boot {
        display: flex;
        height: 100%;
      }
      #boot .b-side {
        width: 280px;
        flex: 0 0 280px;
        border-right: 1px solid rgba(255, 255, 255, 0.07);
        background: #191b1e;
      }
      #boot .b-main {
        flex: 1;
        padding: 28px 32px;
      }
      #boot .b-bar {
        height: 14px;
        border-radius: 6px;
        background: #1f2125;
        margin-bottom: 12px;
      }
      #boot .b-bar.s {
        width: 160px;
      }
      #boot .b-card {
        height: 120px;
        border-radius: 10px;
        background: #1c1e22;
        border: 1px solid rgba(255, 255, 255, 0.06);
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <div class="b-side"></div>
        <div class="b-main">
          <div class="b-bar s"></div>
          <div class="b-card"></div>
          <div class="b-card"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
